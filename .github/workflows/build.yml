name: Build Saxena Computer APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Clean Android Project
        run: |
          flutter create --org com.saxenacomputers --project-name saxena_computer /tmp/temp_app
          cp -r /tmp/temp_app/android ./android
          cp google-services.json android/app/google-services.json

      - name: Configure Firebase in Gradle
        run: |
          python3 -c '
          with open("android/settings.gradle.kts", "r") as f:
              s = f.read()
          s = s.replace("org.jetbrains.kotlin.android", "com.google.gms.google-services\") version \"4.4.2\" apply false\n    id(\"org.jetbrains.kotlin.android")
          with open("android/settings.gradle.kts", "w") as f:
              f.write(s)

          with open("android/app/build.gradle.kts", "r") as f:
              b = f.read()
          b = b.replace("id(\"kotlin-android\")", "id(\"kotlin-android\")\n    id(\"com.google.gms.google-services\")")
          b = b.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
          with open("android/app/build.gradle.kts", "w") as f:
              f.write(b)
          '

      - name: Get Dependencies & Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saxena-Computer-App
          path: build/app/outputs/flutter-apk/app-release.apk
