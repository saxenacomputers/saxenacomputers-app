name: Build Saxena Computer APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Clean Flutter Project
        run: |
          flutter create --org com.saxenacomputers --project-name saxena_computer /tmp/app
          cp pubspec.yaml /tmp/app/pubspec.yaml
          cp -r lib/* /tmp/app/lib/
          cp google-services.json /tmp/app/google-services.json
          cd /tmp/app
          python3 -c '
          import json
          with open("google-services.json") as f:
              data = json.load(f)
          proj = data["project_info"]
          client = data["client"][0]
          dart_code = f"""import "package:firebase_core/firebase_core.dart";
          class DefaultFirebaseOptions {{
            static const FirebaseOptions android = FirebaseOptions(
              apiKey: "{client["api_key"][0]["current_key"]}",
              appId: "{client["client_info"]["mobilesdk_app_id"]}",
              messagingSenderId: "{proj["project_number"]}",
              projectId: "{proj["project_id"]}",
              storageBucket: "{proj.get("storage_bucket", "")}",
            );
          }}
          """
          with open("lib/firebase_options.dart", "w") as f:
              f.write(dart_code)

          with open("android/app/build.gradle.kts") as f: b = f.read()
          b = b.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
          with open("android/app/build.gradle.kts", "w") as f: f.write(b)

          with open("android/app/src/main/AndroidManifest.xml") as f: m = f.read()
          queries = """<queries>
              <intent>
                  <action android:name="android.intent.action.VIEW" />
                  <data android:scheme="https" />
              </intent>
              <intent>
                  <action android:name="android.intent.action.VIEW" />
                  <data android:scheme="http" />
              </intent>
          </queries>
          </manifest>"""
          m = m.replace("</manifest>", queries)
          with open("android/app/src/main/AndroidManifest.xml", "w") as f: f.write(m)
          '
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saxena-Computer-App
          path: /tmp/app/build/app/outputs/flutter-apk/app-release.apk
