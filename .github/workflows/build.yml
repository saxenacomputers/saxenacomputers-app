name: Build Saxena Computer APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Clean Flutter Project
        run: |
          flutter create --org com.saxenacomputers --project-name saxena_computer /tmp/app
          cp pubspec.yaml /tmp/app/pubspec.yaml
          cp -r lib/* /tmp/app/lib/
          cp google-services.json /tmp/app/android/app/google-services.json
          cd /tmp/app
          python3 -c '
          with open("android/settings.gradle.kts") as f: s = f.read()
          s = s.replace("plugins {", "plugins {\n    id(\"com.google.gms.google-services\") version \"4.4.2\" apply false")
          with open("android/settings.gradle.kts", "w") as f: f.write(s)

          with open("android/app/build.gradle.kts") as f: b = f.read()
          b = b.replace("plugins {", "plugins {\n    id(\"com.google.gms.google-services\")")
          b = b.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
          with open("android/app/build.gradle.kts", "w") as f: f.write(b)

          with open("android/app/src/main/AndroidManifest.xml") as f: m = f.read()
          m = m.replace("<manifest", "<manifest xmlns:tools=\"http://schemas.android.com/tools\"") if "xmlns:tools" not in m else m
          m = m.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application")
          with open("android/app/src/main/AndroidManifest.xml", "w") as f: f.write(m)
          '
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saxena-Computer-App
          path: /tmp/app/build/app/outputs/flutter-apk/app-release.apk
