name: Build Saxena Computer APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android Project Wrapper
        run: |
          flutter create --org com.saxenacomputers --project-name saxena_computer .
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: Configure Firebase in Gradle
        run: |
          sed -i 's/dependencies {/dependencies {\n        classpath "com.google.gms:google-services:4.4.2"/' android/build.gradle || true
          echo 'apply plugin: "com.google.gms.google-services"' >> android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle || true

      - name: Get Dependencies & Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saxena-Computer-App
          path: build/app/outputs/flutter-apk/app-release.apk
