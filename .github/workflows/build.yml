name: Build Saxena Computer APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Clean Android Project
        run: |
          flutter create --org com.saxenacomputers --project-name saxena_computer /tmp/temp_app
          cp -r /tmp/temp_app/android ./android
          cp google-services.json android/app/google-services.json

      - name: Configure Firebase in Gradle
        run: |
          if [ -f "android/settings.gradle.kts" ]; then
            sed -i 's/id("com.android.application")/id("com.android.application")\n    id("com.google.gms.google-services") version "4.4.2" apply false/' android/settings.gradle.kts
            sed -i 's/id("com.android.application")/id("com.android.application")\n    id("com.google.gms.google-services")/' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts
          elif [ -f "android/settings.gradle" ]; then
            sed -i 's/id "com.android.application"/id "com.android.application"\n    id "com.google.gms.google-services" version "4.4.2" apply false/' android/settings.gradle
            sed -i 's/id "com.android.application"/id "com.android.application"\n    id "com.google.gms.google-services"/' android/app/build.gradle
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle
          fi

      - name: Get Dependencies & Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saxena-Computer-App
          path: build/app/outputs/flutter-apk/app-release.apk
